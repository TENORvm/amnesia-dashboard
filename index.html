
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.wrap{padding:1.5rem 0;}
.title{font-size:13px;font-weight:500;color:var(--color-text-secondary);letter-spacing:.06em;text-transform:uppercase;margin-bottom:1.5rem;}
.chart-label{font-size:11px;color:var(--color-text-tertiary);margin-bottom:.5rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;}
.chart-wrap{width:100%;margin-bottom:2rem;}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:.75rem;}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--color-text-secondary);}
.ld{width:24px;height:3px;border-radius:2px;flex-shrink:0;}
</style>

<div class="wrap">
<div class="title">Анализ игрового цикла — Amnesia: The Bunker</div>

<div class="chart-label">Кривая напряжения по зонам</div>
<div class="chart-wrap" style="position:relative;height:220px;">
  <canvas id="c1"></canvas>
</div>

<div class="chart-label">Сравнение зон: середина vs финал</div>
<div class="chart-wrap" style="position:relative;height:200px;">
  <canvas id="c2"></canvas>
</div>

<div class="chart-label">Ресурсный баланс по главам (нормал)</div>
<div class="chart-wrap" style="position:relative;height:180px;">
  <canvas id="c3"></canvas>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const grid=dark?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.06)';
const tick=dark?'rgba(255,255,255,0.38)':'rgba(0,0,0,0.38)';
const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:grid},ticks:{color:tick,font:{size:10}}},y:{grid:{color:grid},ticks:{color:tick,font:{size:10}}}}};

new Chart(document.getElementById('c1'),{
  type:'line',
  data:{
    labels:['Администрация','Казармы','Техотсек','Тюрьма','Арсенал','Туннели'],
    datasets:[
      {label:'Давление Зверя',data:[4,6,9,7,9,3],borderColor:'#D85A30',tension:.4,pointRadius:3,pointBackgroundColor:'#D85A30',fill:false,borderWidth:2},
      {label:'Дефицит ресурсов',data:[2,4,6,6,8,3],borderColor:'#378ADD',tension:.4,pointRadius:3,pointBackgroundColor:'#378ADD',fill:false,borderWidth:2},
      {label:'Сложность навигации',data:[3,5,9,7,8,3],borderColor:'#7F77DD',tension:.4,pointRadius:3,pointBackgroundColor:'#7F77DD',fill:false,borderWidth:2},
      {label:'Нарратив',data:[4,9,5,7,4,8],borderColor:'#1D9E75',tension:.4,pointRadius:3,pointBackgroundColor:'#1D9E75',fill:false,borderWidth:2,borderDash:[4,3]}
    ]
  },
  options:{...base,scales:{x:{grid:{color:grid},ticks:{color:tick,font:{size:10}}},y:{min:0,max:10,grid:{color:grid},ticks:{color:tick,font:{size:10},stepSize:2}}}}
});

new Chart(document.getElementById('c2'),{
  type:'bar',
  data:{
    labels:['Давление Зверя','Дефицит ресурсов','Сложность навигации','Цена смерти (мин)'],
    datasets:[
      {label:'Техотсек / Арсенал',data:[9,8,9,35],backgroundColor:'rgba(216,90,48,0.7)',borderRadius:3},
      {label:'Римские туннели',data:[3,3,3,12],backgroundColor:'rgba(55,138,221,0.6)',borderRadius:3}
    ]
  },
  options:{
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{
      x:{grid:{color:grid},ticks:{color:tick,font:{size:10}}},
      y:{grid:{color:grid},ticks:{color:tick,font:{size:10}},max:40}
    }
  }
});

new Chart(document.getElementById('c3'),{
  type:'bar',
  data:{
    labels:['Администрация','Казармы','Техотсек','Тюрьма','Арсенал','Туннели'],
    datasets:[
      {label:'Доступность лечения',data:[8,7,5,5,3,7],backgroundColor:'rgba(29,158,117,0.65)',borderRadius:3},
      {label:'Доступность патронов',data:[7,6,5,5,3,6],backgroundColor:'rgba(127,119,221,0.65)',borderRadius:3}
    ]
  },
  options:{
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{
      x:{grid:{color:grid},ticks:{color:tick,font:{size:10}}},
      y:{min:0,max:10,grid:{color:grid},ticks:{color:tick,font:{size:10},stepSize:2}}
    }
  }
});
</script>

<div class="legend">
  <div class="li"><div class="ld" style="background:#D85A30;"></div>Давление Зверя</div>
  <div class="li"><div class="ld" style="background:#378ADD;"></div>Дефицит ресурсов / Туннели</div>
  <div class="li"><div class="ld" style="background:#7F77DD;"></div>Сложность навигации</div>
  <div class="li"><div class="ld" style="background:#1D9E75;"></div>Нарратив / Лечение</div>
</div>
